# Gera o instalador e publica o Release quando você envia uma tag "vX.Y.Z":
#   git tag v1.0.0 && git push origin v1.0.0
# Também pode ser rodado à mão (aba Actions → release → Run workflow): gera o instalador como artefato.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read    # padrão mínimo; só o job abaixo ganha escrita

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # necessário para criar o Release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versão a partir da tag
        id: ver
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}      # via variável de ambiente, nunca interpolado no script
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $v = $env:REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.$($env:RUN_NUMBER)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar e gerar instalador
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Guardar instalador (artefato)
        uses: actions/upload-artifact@v7
        with:
          name: Mission4Me-${{ steps.ver.outputs.version }}
          path: |
            dist/Mission4Me-Setup-*.exe
            dist/Mission4Me-Setup-*.exe.sha256

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Mission4Me ${{ steps.ver.outputs.version }}
          files: |
            dist/Mission4Me-Setup-*.exe
            dist/Mission4Me-Setup-*.exe.sha256
          generate_release_notes: true
